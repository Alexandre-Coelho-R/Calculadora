<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Calculadora</title>
</head>
<body>
    <div id="divCalculadora">

        <div id="divTela">
            <p id="numeros">0</p>
        </div>

        <div id="divNumeros">

            <button id="sete">
                <p>7</p>
            </button>

            <button id="oito">
                <p>8</p>
            </button>

            <button id="nove">
                <p>9</p>
            </button>

            <button id="divisao">
                <p>÷</p>
            </button>

            <button id="quatro">
                <p>4</p>
            </button>

            <button id="cinco">
                <p>5</p>
            </button>

            <button id="seis">
                <p>6</p>
            </button>

            <button id="multiplicacao">
                <p>×</p>
            </button>

            <button id="um">
                <p>1</p>
            </button>

            <button id="dois">
                <p>2</p>
            </button>

            <button id="tres">
                <p>3</p>
            </button>

            <button id="subtracao">
                <p>-</p>
            </button>

            <button id="zero">
                <p>0</p>
            </button>

            <button id="ponto">
                <p>.</p>
            </button>

            <button id="igual">
                <p>=</p>
            </button>

            <button id="soma">
                <p>+</p>
            </button>

        </div>

    </div>
</body>
</html>
